services:
  # menyimpan metadata dan koordinasi Kafka
  zookeeper-batch18:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper-batch18
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # message broker
  kafka-batch18:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-batch18
    depends_on:
      - zookeeper-batch18
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-batch18:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-batch18:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # UI untuk melihat topic, message, consumer, broker, dan aktivitas Kafka
  redpanda-batch18:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-batch18
    depends_on:
      - kafka-batch18
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka-batch18:29092

