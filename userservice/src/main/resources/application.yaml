spring:
  application:
    name: userservice
  datasource:
    # jdbc:nama_db://host:port/nama_schema
    url: jdbc:postgresql://localhost:5432/training_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    context-path: /user
  port: 9100

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 jam dalam milliseconds (24 * 60 * 60 * 1000)

scheduler:
  test:
    enabled: true
    cron: "*/10 * * * * *"   // jalan tiap 10 detik
