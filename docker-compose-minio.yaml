services:
  minio:
    image: minio/minio:latest
    container_name: minio-server
    ports:
      - "9000:9000" # port api
      - "9001:9001" # port UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:
    name: minio_storage

