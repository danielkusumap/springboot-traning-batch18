spring:
  application:
    name: registryservice

server:
  port: 8761

eureka:
  instance:
    prefer-ip-address: true
    statusPageUrlPath: /health
    healthCheckUrlPath: /info
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: http://localhost:${server.port}/eureka/